# Integración continua de TAU (PLAN §56, etapa 3): en cada push a main y en cada pull request,
# revisión de código (ruff) y todas las pruebas, incluidas las de navegador (Chrome del runner).
#
# Las acciones van fijadas por hash de commit (no por etiqueta, que puede moverse): el repositorio es
# público. Para actualizarlas: `gh api repos/<dueño>/<acción>/commits/<etiqueta> --jq .sha`.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.13"
          enable-cache: true

      - name: Dependencias (exactamente las de uv.lock)
        run: uv sync --frozen

      - name: Revisión de código
        run: uvx ruff@0.17.4 check app scripts tests main.py

      - name: Pruebas (con navegador)
        run: uv run pytest -q --navegador
