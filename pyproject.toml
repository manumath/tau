[project]
name = "portal-investigacion"
version = "0.1.0"
description = "Portal de gestión de la actividad de investigación del instituto (FastHTML + HTMX)"
authors = [
    { name = "Charlie", email = "manumath@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "bibtexparser>=2.0.1",
    "fastlite>=0.2.4",
    "fastmigrate>=0.5.3",
    "httpx2>=2.13.1",
    "lxml>=6.1.3",
    "monsterui>=1.0.47",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "python-fasthtml>=0.14.13",
]

[dependency-groups]
dev = [
    "playwright==1.63.0",
    "pytest>=9.1.1",
    "pytest-playwright==0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
