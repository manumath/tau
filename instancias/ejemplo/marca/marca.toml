# Marca de la instancia (PLAN §74). Esta es una PLANTILLA con los valores de la marca genérica del sistema: cámbielos por
# los colores de su unidad y ponga junto a este archivo sus imágenes, con los nombres de static/img/marca/ (isotipo.svg,
# isotipo-blanco.svg, logotipo.png, logotipo-blanco.png, icono-180.png, icono-192.png, icono-512.png, favicon.svg) y, si
# quiere el logo del instituto en el membrete de los informes de investigación, instituto.png. Sin imágenes rigen las
# genéricas. Los colores del tema son variables HSL sin «hsl()»; tests/test_marca.py exige contraste AA (4,5:1) en claro y oscuro.
